<!DOCTYPE html>

<head>

  <title>Orelega font</title>=
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "_Orelega";
      src: url("./Orelega-Bold.woff2");
    }
    html, body {
      font-family: "_Orelega", serif;
      margin: 0;
      width: auto;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }
    #scroller {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }
    section {
      text-align: right;
      overflow: hidden;
      width: 100%;
      height: 100svh;
      scroll-snap-align: start;
      position: relative;
    }
    section:nth-child(2n) {
      background: red;
    }
    /* common */
    #tradwife {
      background-image: url("img/tradwife_bg.svg");
      background-size: cover;
      background-position: center;
    }
    #tradwifeLang, #tradwifeLangSel {
      font-family: "Oswald";
      font-size: 1.15rem;
    }

    #bunny, #logotype {
      position: absolute;
      display: flex;
      justify-content: stretch;
      align-items: stretch;
    }
    .relativizer {
      position: relative;
      width: inherit;
      height: inherit;
    }
    .main, .sub {
      position: absolute;
      height: auto;
    }
    @keyframes bounceZoom {
      from {
        scale: 1.0;
      }
      to {
        scale: 1.15;
      }
    }
    .relativizer > .main {
      position: absolute;
      inset: 0;
      width: 100%;
      height: auto;
    }
    #bunny > .relativizer > .sub {
      right: -30%;
      top: -2%;
      width: 50%;
      transform-origin: -20% 80%;
      animation: 600ms 0ms infinite alternate both ease-in-out bounceZoom;
    }
    #logotype > .relativizer > .sub {
      width: 18.75%;
      right: 9.7%;
      top: -20.2%;
      transform-origin: 40% 110%;
      animation: 600ms 0ms infinite alternate both ease-in-out bounceZoom;
    }
    #tradwifeText {
      position: absolute;
      inset: 0 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      text-align: center;
    }
    #heard {
      max-width: 100%;
      flex: 0 0 auto;
      font-family: "Pacifico", serif;
      color: rgb(61 51 37);
      line-height: 1.0;
    }
    #heard > div {
      max-width: 100%;
      position: relative;
      z-index: 2;
      margin: 0.5em 0;
      text-shadow: 0 0 0.05em rgb(245 222 190);
    }
    #heard > div:nth-child(2) {
      margin: -0.25em 0em;
      z-index: 1;
      font-family: "_Orelega", serif;
      font-size: 3em;
      color: rgb(180 75 68);
      letter-spacing: -0.02em;
    }
    #heardExample {
      flex: 0 0 auto;
      color: rgb(45 78 73);
      text-shadow: 0 0 0.05em rgb(245 222 190);
      word-break: break-word;
      hyphenate-character: "";
    }
    #heardExample > p {
      margin: 0 0.25em;
    }

    /* portrait orientation only */
    #bunny {
      left: 5vw;
      top: calc(40vh - 40vw);
      width: 50vw;
      height: 100vw;
    }
    #logotype {
      left: 50vw;
      transform: translateX(-50%);
      bottom: calc(40vh - 40vw);
      /* 8:3 */
      width: 80vw;
      height: 30vw;
    }
    #tradwifePortrait {
      position: absolute;
      inset: auto calc(75vw - 31.25svh) 0 auto;
      height: 100svh;
      width: 62.5svh;
    }
    #tradwifeText {
      left: calc(25vw + 12.5svh);
      /* width of this container */
      --w: calc(75vw - 12.5svh);
    }
    #heard {
      font-size: calc(var(--w) * 0.07);
    }
    #heardExample {
      font-size: 4svh;
    }
    @media (min-aspect-ratio: 1/1) {
      /* landscape orientation */
      #bunny {
        left: calc(10vw - 10vh);
        top: 5vh;
        width: 50vh;
        height: 100vh;
      }
      #logotype {
        left: auto;
        transform: none;
        right: 3vh;
        bottom: 3vh;
        /* 8:3 */
        width: min(64vw, 160vh);
        height: min(24vw, 60vh);
      }
      #tradwifeText {
        --w: 70svh;
      }
    }
  </style>
